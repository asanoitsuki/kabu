  <rect x="57" y="31" width="7" height="6" rx="1" fill="#6366f1" opacity="0.7"/>

  <rect x="36" y="41" width="7" height="6" rx="1" fill="#a5f3fc" opacity="0.8"/>
  <rect x="47" y="41" width="7" height="6" rx="1" fill="#6366f1" opacity="0.7"/>
