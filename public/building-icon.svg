<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- 左の低いビル -->
  <rect x="10" y="52" width="22" height="38" rx="2" fill="#818cf8" opacity="0.6"/>
  <!-- 左ビル窓 -->
  <rect x="14" y="56" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="23" y="56" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="14" y="65" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="23" y="65" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="14" y="74" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="23" y="74" width="5" height="5" rx="1" fill="white" opacity="0.5"/>

  <!-- 右の低いビル -->
  <rect x="68" y="48" width="22" height="42" rx="2" fill="#818cf8" opacity="0.6"/>
  <!-- 右ビル窓 -->
  <rect x="72" y="52" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="81" y="52" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="72" y="61" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="81" y="61" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="72" y="70" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
