  <rect x="57" y="51" width="7" height="6" rx="1" fill="#a5f3fc" opacity="0.8"/>

  <rect x="36" y="61" width="7" height="6" rx="1" fill="#6366f1" opacity="0.7"/>
  <rect x="47" y="61" width="7" height="6" rx="1" fill="#a5f3fc" opacity="0.8"/>
  <rect x="57" y="61" width="7" height="6" rx="1" fill="#6366f1" opacity="0.7"/>

  <!-- エントランス -->
  <rect x="44" y="76" width="12" height="14" rx="2" fill="#4f46e5" opacity="0.6"/>

  <!-- 地面 -->
