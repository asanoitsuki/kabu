  <!-- タワー上部アンテナ -->
  <rect x="49" y="8" width="2" height="10" rx="1" fill="white" opacity="0.9"/>
  <circle cx="50" cy="8" r="2" fill="#fbbf24"/>

  <!-- タワー窓（3列×6行） -->
  <rect x="36" y="21" width="7" height="6" rx="1" fill="#6366f1" opacity="0.7"/>
  <rect x="47" y="21" width="7" height="6" rx="1" fill="#6366f1" opacity="0.7"/>
  <rect x="57" y="21" width="7" height="6" rx="1" fill="#a5f3fc" opacity="0.8"/>

  <rect x="36" y="31" width="7" height="6" rx="1" fill="#6366f1" opacity="0.7"/>
